<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp-Thug | Online Quiz Platform</title>
    <meta name="description" content="QuizApp-Thug is a fast, interactive online quiz platform built for students and quick learning.">
    <meta name="keywords" content="QuizApp-Thug, Thug Quiz App, Biology Quiz, Online Quiz">
    <meta name="robots" content="index, follow">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; transition: all 0.3s ease; }
        body { background: #f0f2f5; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
        
        .container { background: white; width: 100%; max-width: 450px; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        
        /* Branding Updates - Jaisa tumne bola */
        h1 { color: #1a73e8; font-size: 16px; margin-bottom: 5px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; } /* Nila aur Chota */
        .branding { color: #202124; font-size: 26px; margin-bottom: 25px; font-weight: 700; display: inline-block; padding-bottom: 5px; } /* Bada, Bold aur Black */
        
        /* Progress Bar */
        .progress-container { display: flex; gap: 4px; margin-bottom: 15px; height: 8px; }
        .progress-step { flex: 1; background: #e0e0e0; border-radius: 10px; }
        .progress-step.active { background: #1a73e8; box-shadow: 0 0 8px rgba(26, 115, 232, 0.5); }
        .progress-step.correct { background: #28a745; }
        .progress-step.wrong { background: #dc3545; }

        /* Quiz Box */
        #quiz-section { display: none; text-align: left; }
        .q-tag { color: #1a73e8; font-weight: 700; font-size: 14px; }
        .question-text { font-size: 18px; font-weight: 600; margin: 10px 0 20px 0; color: #202124; line-height: 1.5; }

        .option { display: block; width: 100%; padding: 15px; margin-bottom: 12px; border: 2px solid #f1f3f4; border-radius: 12px; background: #f8f9fa; cursor: pointer; font-size: 15px; text-align: left; outline: none; font-weight: 500; }
        .option:active { transform: scale(0.97); }
        .correct-opt { background: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: 700; }
        .wrong-opt { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }

        .btn { background: #1a73e8; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3); }

        /* Summary & Review */
        #summary-section { display: none; text-align: center; }
        .score-card { background: #e8f0fe; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .score-circle { width: 80px; height: 80px; border-radius: 50%; background: #1a73e8; color: white; line-height: 80px; font-size: 24px; font-weight: 800; margin: 10px auto; }
        
        .review-container { text-align: left; max-height: 280px; overflow-y: auto; padding: 5px; margin-bottom: 15px; border-top: 1px solid #eee; }
        .review-item { padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid #ccc; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.06); font-size: 13.5px; }
        .review-item.correct-border { border-left-color: #28a745; }
        .review-item.wrong-border { border-left-color: #dc3545; }
        .status-tag { font-size: 10px; font-weight: 800; float: right; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>Quiz App</h1>
        <div class="branding">By Dipanshu Soni</div>
        <p style="font-size: 15px; color: #5f6368; margin-bottom: 25px;">Sir dwara bheje gaye sawalon ka test dene ke liye taiyar?</p>
        <button class="btn" onclick="startQuiz()">START QUIZ 🔥</button>
    </div>

    <div id="quiz-section">
        <div class="progress-container" id="progress-bar"></div>
        <div class="q-tag" id="q-number">Question 1</div>
        <div class="question-text" id="q-text">Sawal load ho rahe hain...</div>
        <div id="options-box"></div>
    </div>

    <div id="summary-section">
        <div class="score-card">
            <h2 style="margin:0; font-size:18px; color:#202124;">Quiz Completed!</h2>
            <div class="score-circle" id="final-score">0</div>
            <p id="feedback-text" style="margin:8px 0 0 0; font-size:15px; font-weight:600; color:#1a73e8;"></p>
        </div>
        <div class="review-container" id="review-list"></div>
        <button class="btn" onclick="location.reload()">RESTART QUIZ</button>
    </div>
</div>

<script>
    const sheetURL = 'https://docs.google.com/spreadsheets/d/1cVW90l_8n-3Dws0sFpR2ywR3pKxrGg45A3TdDUr08pM/export?format=csv';
    
    let questions = [];
    let currentIdx = 0;
    let score = 0;
    let userChoices = [];

    async function startQuiz() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-section').style.display = 'block';
        
        try {
            const res = await fetch(sheetURL);
            const data = await res.text();
            const rows = data.split('\n').filter(r => r.trim() !== '').slice(1);
            
            questions = rows.map(row => {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                return {
                    q: cols[0].replace(/"/g, ''),
                    opts: [cols[1], cols[2], cols[3], cols[4]].map(o => o.replace(/"/g, '')),
                    ans: cols[5].replace(/"/g, '').trim()
                };
            });

            createProgressBar();
            showQuestion();
        } catch (e) {
            alert("Sheet access check karein!");
        }
    }

    function createProgressBar() {
        const bar = document.getElementById('progress-bar');
        bar.innerHTML = '';
        questions.forEach((_, i) => {
            const step = document.createElement('div');
            step.className = 'progress-step';
            step.id = `step-${i}`;
            bar.appendChild(step);
        });
    }

    function showQuestion() {
        const qData = questions[currentIdx];
        document.getElementById('q-number').innerText = `QUESTION ${currentIdx + 1} OF ${questions.length}`;
        document.getElementById('q-text').innerText = qData.q;
        document.getElementById(`step-${currentIdx}`).classList.add('active');
        
        const box = document.getElementById('options-box');
        box.innerHTML = '';
        
        qData.opts.forEach(opt => {
            const b = document.createElement('button');
            b.className = 'option';
            b.innerText = opt;
            b.onclick = () => handleAnswer(opt, qData.ans, b);
            box.appendChild(b);
        });
    }

    function handleAnswer(selected, correct, btn) {
        const allOpts = document.querySelectorAll('.option');
        allOpts.forEach(o => o.style.pointerEvents = 'none');

        const isCorrect = selected.trim() === correct.trim();
        const step = document.getElementById(`step-${currentIdx}`);

        userChoices.push({
            question: questions[currentIdx].q,
            selected: selected,
            correct: correct,
            status: isCorrect
        });

        if (isCorrect) {
            btn.classList.add('correct-opt');
            step.classList.add('correct');
            score++;
        } else {
            btn.classList.add('wrong-opt');
            step.classList.add('wrong');
            allOpts.forEach(o => { if(o.innerText.trim() === correct.trim()) o.classList.add('correct-opt'); });
        }

        setTimeout(() => {
            currentIdx++;
            if (currentIdx < questions.length) {
                showQuestion();
            } else {
                showSummary();
            }
        }, 800);
    }

    function showSummary() {
        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('summary-section').style.display = 'block';
        document.getElementById('final-score').innerText = `${score}/${questions.length}`;
        document.getElementById('feedback-text').innerText = score === questions.length ? "EXCELLENT! 🏆" : "GOOD EFFORT! 👍";

        const list = document.getElementById('review-list');
        list.innerHTML = '';
        userChoices.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = `review-item ${item.status ? 'correct-border' : 'wrong-border'}`;
            div.innerHTML = `
                <span class="status-tag" style="background:${item.status ? '#d4edda':'#f8d7da'}; color:${item.status ? '#28a745':'#dc3545'}">
                    ${item.status ? 'Correct':'Wrong'}
                </span>
                <strong style="display:block; margin-bottom:5px;">${i+1}. ${item.question}</strong>
                <div style="font-size:12px; color:#555;">Your Answer: ${item.selected}</div>
                ${!item.status ? `<div style="font-size:12px; color:#28a745; font-weight:600;">Correct: ${item.correct}</div>` : ''}
            `;
            list.appendChild(div);
        });
    }
</script>
</body>
</html>
